<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
</head>
<body>
    <form method="post" action="/login_check">
        {% csrf_token %}
        用户名：<input type="text" name="username" value="{{ usermame }}"></br>
        密码：<input type="password" name="password"></br>
        验证码：<input type="text" name="vcode"><img src="/generate_captcha"></br>
        <input type="checkbox" id="remeber" name="remeber">记住用户名
        <input type="submit" value="登录">
    </form>
<div id="errmessage">{{ errmessage }}</div>
</body>
</html>
